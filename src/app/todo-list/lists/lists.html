<div class="flex flex-col p-2 mb-1 space-y-0.5">
  @for (task of allTasks(); track task.id) {
    <div
      @taskAnimation
      class="flex justify-between items-center border border-gray-400 rounded bg-white drop-shadow-md hover:shadow-md transition-all duration-200 p-4"
    >
      <p class="">{{ task.title }}</p>
      <div class="space-x-2">
        <button
          mat-icon-button
          (click)="toggle(task.id)"
          aria-label="Check task"
          class="text-success border-white border hover:bg-success hover:text-white transition-colors duration-200 p-2"
        >
          <mat-icon class="text-success hover:text-white">check</mat-icon>
        </button>
        <button
          mat-icon-button
          (click)="delete(task.id)"
          aria-label="Delete task"
          class="text-error border-white border hover:bg-amber-500 transition-colors duration-200 p-2"
        >
          <mat-icon class="text-error">delete</mat-icon>
        </button>
      </div>
    </div>
  }
</div>
