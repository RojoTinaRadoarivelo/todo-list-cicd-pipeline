<div class="flex flex-col p-2 mb-1 space-y-0.5">
  @for (task of completedTasks(); track task.id) {
    <div
      @taskAnimation
      class="flex justify-between items-center border border-gray-400 rounded bg-gray-200 drop-shadow-md hover:shadow-md transition-all duration-200 p-4"
    >
      <p class="line-through">{{ task.title }}</p>
      <div class="space-x-2">
        <button
          mat-icon-button
          (click)="toggle(task.id)"
          aria-label="Undo task"
          class="text-info border-white border hover:bg-secondary-400 transition-colors duration-200 p-2"
        >
          <mat-icon class="text-info">undo</mat-icon>
        </button>
        <button
          mat-icon-button
          (click)="delete(task.id)"
          class="text-error border-white border hover:bg-amber-500 transition-colors duration-200 p-2"
          aria-label="Delete task"
        >
          <mat-icon class="text-error">delete</mat-icon>
        </button>
      </div>
    </div>
  }
</div>
