<form
  (ngSubmit)="add()"
  class="flex justify-between items-center gap-3 p-3 rounded-2xl shadow-sm hover:shadow-md transition-all duration-300"
>
  <mat-form-field appearance="fill" class="flex-1">
    <mat-label>New Task</mat-label>
    <input
      matInput
      type="text"
      [(ngModel)]="title"
      name="title"
      class=""
      required
    />
  </mat-form-field>
  <div class="-mt-3">
    <button
      mat-fab
      color="primary"
      type="submit"
      class="bg-dark text-white rounded scale-95 hover:scale-100 transition-transform duration-200"
    >
      <mat-icon>add</mat-icon>
    </button>
  </div>
</form>
